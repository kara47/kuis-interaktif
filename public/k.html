<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memuat kuis</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1030;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px}
</style>
</head>
<body>
<p id="pesan">Memuat kuis…</p>
<script>
(async function(){
  const id=location.pathname.split('/')[2]||'';
  function utf8ToB64(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
  function gagal(msg){document.getElementById('pesan').textContent=msg;}
  try{
    const r=await fetch('/api/kuis/'+encodeURIComponent(id));
    if(r.status===404)return gagal('Kuis tidak ditemukan. Periksa kembali link dari pengajar.');
    if(!r.ok)return gagal('Kuis sedang tidak bisa dibuka. Coba lagi beberapa saat lagi.');
    const d=await r.json();
    const g=await fetch('/g/'+(['boss','pacman'].includes(d.game)?d.game:'galaksi')+'.html');
    if(!g.ok)return gagal('Game gagal dimuat. Coba muat ulang halaman ini.');
    const html=(await g.text()).replace(/(<script id="quiz-data" type="text\/plain">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+utf8ToB64(JSON.stringify(d))+b);
    document.open();document.write(html);document.close();
  }catch(e){gagal('Koneksi bermasalah. Periksa internet lalu muat ulang halaman ini.');}
})();
</script>
</body>
</html>
